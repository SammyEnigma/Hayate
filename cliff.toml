# git-cliff configuration file
# https://git-cliff.org/docs/configuration

[changelog]

header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
          {% if commit.breaking %}[**breaking**] {% endif %}\
          {{ commit.message | upper_first }} \
          ([{{ commit.id | truncate(len=7, end="") }}](https://github.com/ShiinaSaku/Hayate/commit/{{ commit.id }}))\
          {% if commit.author.name %} by {{ commit.author.name }}{% endif %}\
    {% endfor %}
{% endfor %}
"""
# template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# remove the leading and trailing sleshes
trim = true

[git]
# parse the commits that do not follow conventional commits
parse_unconventional = true
# filter out the commits that are not conventional
filter_unconventional = false
# regex for preprocessing the commit messages
commit_preprocessors = [
    # Replace issue numbers
    # { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/ShiinaSaku/Hayate/issues/${2}))" },
]
# regex for parsing and grouping commits
commit_parsers = [
    { message = "^feat", group = "✦ Features" },
    { message = "^fix", group = "✦ Bug Fixes" },
    { message = "^doc", group = "✦ Documentation" },
    { message = "^perf", group = "✦ Performance" },
    { message = "^refactor", group = "✦ Refactoring & Code Quality" },
    { message = "^style", group = "✦ Styling" },
    { message = "^test", group = "✦ Testing" },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore\\(deps\\)", group = "✦ Dependency Updates" },
    { message = "^chore|^ci|^build", group = "✦ Maintenance & CI/CD" },
    { message = "^dist", skip = true },
    { body = ".*", group = "Other" },
]
# protect breaking changes from being skipped group
protect_breaking_commits = false
# filter out the commits that are not matched by commit_parsers
filter_commits = false
# glob pattern for matching git tags
tag_pattern = "v[0-9]*"
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest
sort_commits = "oldest"
