[package]
name = "hayate-ffi"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = 'C FFI wrapper around the Hayate transfer engine.'
documentation = 'https://docs.rs/hayate-ffi'
readme = '../README.md'
keywords = ['quic', 'transfer', 'ffi', 'lan', 'library']
categories = ['development-tools::ffi', 'network-programming']
publish = false

[lib]
name = "hayate_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
hayate = { path = "../hayate-engine", version = "2.0.0" }
compio = { workspace = true }
anyhow = { workspace = true }
