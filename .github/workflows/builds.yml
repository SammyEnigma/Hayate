name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs_on || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hayate-darwin-amd64
            target: x86_64-apple-darwin
            runs_on: macos-latest
            output: hayate
            rename_to: hayate-darwin-amd64
          - name: hayate-darwin-arm64
            target: aarch64-apple-darwin
            runs_on: macos-latest
            output: hayate
            rename_to: hayate-darwin-arm64
          - name: hayate-linux-amd64
            target: x86_64-unknown-linux-gnu
            output: hayate
            rename_to: hayate-linux-amd64
          - name: hayate-linux-arm64
            target: aarch64-unknown-linux-gnu
            output: hayate
            rename_to: hayate-linux-arm64
          - name: hayate-windows-amd64
            target: x86_64-pc-windows-msvc
            runs_on: windows-latest
            output: hayate.exe
            rename_to: hayate-windows-amd64.exe
          - name: hayate-termux-arm64
            target: aarch64-linux-android
            output: hayate
            rename_to: hayate-termux-arm64
            is_android: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross-compilers (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set up NDK (Android)
        if: matrix.is_android
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build Binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: aarch64-linux-android24-clang
          CC_aarch64_linux_android: aarch64-linux-android24-clang
          AR_aarch64_linux_android: llvm-ar
        run: |
          if [ "${{ matrix.is_android }}" = "true" ]; then
            export PATH="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          fi
          cargo build --target ${{ matrix.target }} --release --bin hayate

      - name: Rename Binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.output }} ${{ matrix.rename_to }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.rename_to }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: target/artifacts
          merge-multiple: true  # flattens into one dir, no subdirectories

      - name: List artifacts
        run: ls -la target/artifacts/

      - name: Generate Artifact Attestations
        uses: actions/attest@v4
        with:
          subject-path: "target/artifacts/*"

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: target/artifacts/*
