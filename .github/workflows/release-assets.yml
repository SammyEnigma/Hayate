name: Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs_on || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hayate-darwin-amd64
            target: x86_64-apple-darwin
            runs_on: macos-latest
            output: hayate
            rename_to: hayate-darwin-amd64
          - name: hayate-darwin-arm64
            target: aarch64-apple-darwin
            runs_on: macos-latest
            output: hayate
            rename_to: hayate-darwin-arm64
          - name: hayate-linux-amd64
            target: x86_64-unknown-linux-gnu
            output: hayate
            rename_to: hayate-linux-amd64
          - name: hayate-linux-arm64
            target: aarch64-unknown-linux-gnu
            output: hayate
            rename_to: hayate-linux-arm64
            use_zigbuild: true
          - name: hayate-windows-amd64
            target: x86_64-pc-windows-msvc
            runs_on: windows-latest
            output: hayate.exe
            rename_to: hayate-windows-amd64.exe
          - name: hayate-termux-arm64
            target: aarch64-linux-android
            output: hayate
            rename_to: hayate-termux-arm64
            is_android: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Install Zig
        if: matrix.use_zigbuild
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        run: pip install cargo-zigbuild

      - name: Set up NDK (Android)
        if: matrix.is_android
        uses: nttld/setup-ndk@aacaf74664d0f8e1b070a865acb47ee25007386d # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Build Binary
        shell: bash
        run: |
          if [ "${{ matrix.is_android }}" = "true" ]; then
            cargo install cargo-ndk
            cargo ndk -t aarch64-linux-android build --profile release-full --bin hayate
          elif [ "${{ matrix.use_zigbuild }}" = "true" ]; then
            cargo zigbuild --target ${{ matrix.target }} --profile release-full --bin hayate
          else
            cargo build --target ${{ matrix.target }} --profile release-full --bin hayate
          fi

      - name: Rename Binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release-full/${{ matrix.output }} ${{ matrix.rename_to }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.rename_to }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: target/artifacts
          merge-multiple: true # flattens into one dir, no subdirectories

      - name: List artifacts
        run: ls -la target/artifacts/

      - name: Generate Artifact Attestations
        uses: actions/attest@v4
        with:
          subject-path: "target/artifacts/*"

      - name: Upload Binaries to Release
        uses: softprops/action-gh-release@2bb465e97f322d3cb2a965294d483e0d26a67aa9 # v3.0.1
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: target/artifacts/*
          fail_on_unmatched_files: true
