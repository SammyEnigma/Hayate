name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Publish crate
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'ShiinaSaku' }}
    outputs:
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.get_tag.outputs.tag }}
    permissions:
      contents: write
      id-token: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - uses: release-plz/action@v0.5
        id: release-plz
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Get tag
        id: get_tag
        shell: bash
        run: |
          releases='${{ steps.release-plz.outputs.releases }}'
          tag=$(echo "$releases" | jq -r '.[0].tag // empty')
          [ -n "$tag" ] && echo "tag=$tag" >> "$GITHUB_OUTPUT" || echo "tag=" >> "$GITHUB_OUTPUT"

  release-pr:
    name: Update release PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'ShiinaSaku' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-assets:
    name: Build & Upload Release Assets
    needs: release
    if: needs.release.outputs.releases_created == 'true' && needs.release.outputs.tag != ''
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-assets.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
