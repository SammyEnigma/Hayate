[workspace]
changelog_config = "cliff.toml"
changelog_path = "CHANGELOG.md"
dependencies_update = true
git_release_enable = true
git_tag_enable = true
pr_branch_prefix = "release-plz-"
pr_labels = ["release"]
publish = true
release_always = false
semver_check = true

[[package]]
name = "hayate"
changelog_update = true
publish = true

[[package]]
name = "hayate-cli"
publish = false
release = false
