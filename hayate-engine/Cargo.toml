[package]
name = "hayate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "High-performance completion-based QUIC transfer engine."
documentation = "https://docs.rs/hayate"
readme = "README.md"
keywords = ["quic", "transfer", "compio", "lan", "crypto"]
categories = ["network-programming", "asynchronous"]

[lib]
name = "hayate"
crate-type = ["lib"]

[features]
benchmarks = []

[dependencies]
# Runtime and QUIC transport.
compio = { workspace = true }
compio-quic = { workspace = true }
futures-util = { workspace = true }

# QUIC protocol and TLS.
quinn-proto = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }

# Cryptography.
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
x25519-dalek = { workspace = true }

# Directory packaging and safe extraction.
tar = "0.4"
walkdir = "2"

# Local network utilities.
get_if_addrs = "0.5.3"
local-ip-address = "0.6.13"
socket2 = { workspace = true }

# Compression, channels, and errors.
flume = "0.12.0"
zstd = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
rapidhash = { workspace = true }

[dev-dependencies]
compio = { workspace = true }
divan = { version = "4.7.0", package = "codspeed-divan-compat" }

[[bench]]
name = "crypto"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "protocol"
harness = false
required-features = ["benchmarks"]
