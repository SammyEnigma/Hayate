[package]

name = 'hayate'
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = 'Completion-based QUIC transfer engine for Hayate.'
documentation = 'https://docs.rs/hayate'
readme = '../README.md'
keywords = ['quic', 'transfer', 'compio', 'lan', 'crypto']
categories = ['network-programming', 'asynchronous']

[lib]

name = 'hayate'
crate-type = ['lib']

[dependencies]

compio = { workspace = true, features = ['time'] }
compio-runtime = { workspace = true }
compio-quic = { workspace = true }
futures-util = { workspace = true }
quinn-proto = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
ring = { workspace = true }
socket2 = { workspace = true }
zstd = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
bytes = { workspace = true }
tar = '0.4'
walkdir = '2'
flume = '0.12.0'

[dev-dependencies]

compio = { version = "0.19.0", features = [
  'macros',
  'fs',
  'net',
  'runtime',
  'time',
] }
