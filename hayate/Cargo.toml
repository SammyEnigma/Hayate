[package]
name = "hayate"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "High-performance completion-based QUIC transfer engine."
documentation = "https://docs.rs/hayate"
readme = "README.md"
keywords = ["quic", "transfer", "compio", "lan", "crypto"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[lib]
name = "hayate"
crate-type = ["lib"]

[features]
benchmarks = []

[dependencies]
# Runtime and QUIC transport.
compio = { workspace = true }
compio-quic = { workspace = true }
futures-util = { workspace = true }

# QUIC protocol and TLS.
quinn-proto = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }

# Cryptography.
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
ring = { workspace = true }
sha2 = { workspace = true }
x25519-dalek = { workspace = true }

# Directory packaging and safe extraction.
tar = { workspace = true }
walkdir = { workspace = true }

# Local network utilities.
if-addrs = { workspace = true }
socket2 = { workspace = true }

# Compression, channels, and errors.
flume = { workspace = true }
mdns-sd = { workspace = true }
zstd = { workspace = true }
thiserror = { workspace = true }
blake3 = { workspace = true }
rapidhash = { workspace = true }

[target.'cfg(all(target_os = "windows", target_arch = "aarch64"))'.dependencies]
blake3 = { workspace = true, features = ["no_neon"] }
zstd = { workspace = true, features = ["no_asm"] }

[dev-dependencies]
compio = { workspace = true }
divan = { version = "5.0.1", package = "codspeed-divan-compat" }
blake3 = { workspace = true }
rapidhash = { workspace = true }
sha2 = { workspace = true }

[[bench]]
name = "crypto"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "protocol"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "hashing"
harness = false
required-features = ["benchmarks"]
